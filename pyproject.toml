[project]
name = "image-search-engine"
version = "0.1.0"
description = "Text-to-image and image-to-image search with CLIP embeddings + FAISS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "open_clip_torch",
    "faiss-cpu",
    "numpy",
    "pandas",
    "pillow",
    "tqdm",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "streamlit",
    "sentencepiece>=0.2.2",
    "transformers>=5.18.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
